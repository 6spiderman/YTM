<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>YTM Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      padding: 24px;
      overflow-y: auto;
      height: 100vh;
    }
    h1 { font-size: 18px; margin-bottom: 24px; color: #e6edf3; }
    h2 { font-size: 13px; font-weight: 600; color: #8b949e; text-transform: uppercase;
         letter-spacing: 0.8px; margin: 20px 0 12px; border-bottom: 1px solid #21262d;
         padding-bottom: 8px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #161b22;
    }
    .row label { color: #c9d1d9; }
    input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #58a6ff; }
    input[type="number"] {
      width: 60px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 4px 8px;
      border-radius: 4px;
    }
    input[type="text"] {
      width: 220px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .shortcut-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #161b22;
    }
    .shortcut-row .action-name { color: #c9d1d9; flex: 1; }
    .shortcut-display {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 4px 10px;
      font-family: monospace;
      font-size: 12px;
      color: #e6edf3;
      min-width: 150px;
      text-align: center;
    }
    .shortcut-display.capturing {
      border-color: #58a6ff;
      color: #58a6ff;
    }
    .shortcut-display.conflict {
      border-color: #da3633;
      color: #da3633;
    }
    .change-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #8b949e;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      margin-left: 8px;
    }
    .change-btn:hover { background: #30363d; color: #e6edf3; }
    .hint { font-size: 11px; color: #6e7681; margin-top: 4px; }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 28px;
      justify-content: flex-end;
    }
    button.primary {
      background: #238636;
      border: 1px solid #2ea043;
      color: #fff;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    button.primary:hover { background: #2ea043; }
    button.secondary {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    button.secondary:hover { background: #30363d; }
    button.danger {
      background: transparent;
      border: 1px solid #da3633;
      color: #da3633;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    button.danger:hover { background: #67060338; }
  </style>
</head>
<body>
  <h1>Settings</h1>

  <h2>General</h2>
  <div class="row">
    <label for="startWithWindows">Start with Windows</label>
    <input type="checkbox" id="startWithWindows">
  </div>
  <div class="row">
    <label for="startMinimised">Start minimised to tray</label>
    <input type="checkbox" id="startMinimised">
  </div>
  <div class="row">
    <label for="minimiseToTray">Minimise to tray (hide from taskbar)</label>
    <input type="checkbox" id="minimiseToTray">
  </div>
  <div class="row">
    <label for="miniPlayerAlwaysOnTop">Mini-player always on top</label>
    <input type="checkbox" id="miniPlayerAlwaysOnTop">
  </div>
  <div class="row">
    <label for="volumeStep">Volume step per keypress (%)</label>
    <input type="number" id="volumeStep" min="1" max="20" value="5">
  </div>

  <h2>Keyboard Shortcuts</h2>
  <div id="shortcuts-container"></div>

  <h2>Notifications</h2>
  <div class="row">
    <label for="notificationsEnabled">Enable notifications</label>
    <input type="checkbox" id="notificationsEnabled">
  </div>
  <div class="row">
    <label for="notifTitle">Title template</label>
    <div>
      <input type="text" id="notifTitle" value="{artist}">
      <div class="hint">Tokens: {artist} {title}</div>
    </div>
  </div>
  <div class="row">
    <label for="notifBody">Body template</label>
    <input type="text" id="notifBody" value="{title}">
  </div>
  <div class="row">
    <label for="showAlbumArt">Show album art</label>
    <input type="checkbox" id="showAlbumArt">
  </div>
  <div class="row">
    <label for="playSound">Play notification sound</label>
    <input type="checkbox" id="playSound">
  </div>
  <div style="margin-top: 8px;">
    <button class="secondary" id="previewNotif">Preview Notification</button>
  </div>

  <div class="actions">
    <button class="danger" id="resetBtn">Reset to Defaults</button>
    <button class="secondary" id="cancelBtn">Cancel</button>
    <button class="primary" id="saveBtn">Save</button>
  </div>

  <script src="settings.js"></script>
</body>
</html>
