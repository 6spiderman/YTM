name: CI

# O8: run on pushes to migration branches and on pull requests only.
on:
  push:
    branches: ['chore/**', 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # actions/checkout v7.0.1 (released 2026-07-20)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      # actions/setup-node v7.0.0 (released 2026-07-14)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint "src/**/*.ts"
      - run: npx jest
      - name: Build Windows installer (unchanged build script)
        run: npm run build -- --publish never
      - name: Check Windows build inputs against baseline
        shell: bash
        run: |
          mkdir -p ci-out
          cp dist-installer/builder-effective-config.yaml ci-out/
          node scripts/check-windows-inputs.js win-baseline-1.0.0 \
            --asar dist-installer/win-unpacked/resources/app.asar --out ci-out/asar-listing.txt
      # actions/upload-artifact v7.0.1 (released 2026-04-10)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-installer
          path: |
            dist-installer/*.exe
            ci-out/*
          if-no-files-found: error

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint "src/**/*.ts"
      - run: npx jest
      - name: Check Windows build inputs against baseline
        run: node scripts/check-windows-inputs.js win-baseline-1.0.0
